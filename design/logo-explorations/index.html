<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ascii conversor — logo explorations</title>
    <style>
      body {
        margin: 0;
        font-family: ui-monospace, Menlo, monospace;
        background: #141210;
        color: #a89e97;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 36px;
        padding: 44px;
      }
      figure { margin: 0; text-align: center; }
      img { width: 100%; max-width: 240px; display: block; margin: 0 auto; }
      figcaption { margin-top: 12px; font-size: 13px; }
      figcaption b { color: #eae4e0; display: block; font-size: 14px; margin-bottom: 3px; }
    </style>
  </head>
  <body>
    <figure><img src="../../public/logo.svg" /><figcaption><b>1 · current</b>flat scanlines + glow</figcaption></figure>
    <figure><img src="beam.svg" /><figcaption><b>2 · beam</b>the orb's light, in scanlines</figcaption></figure>
    <figure><img src="dissolve.svg" /><figcaption><b>3 · dissolve</b>type scattering into cells</figcaption></figure>
    <figure><img src="cursor.svg" /><figcaption><b>4 · cursor</b>blinking block cursor (animated)</figcaption></figure>
    <figure><img src="sweep.svg" /><figcaption><b>5 · sweep</b>light band refresh (animated)</figcaption></figure>
    <figure><img src="resolve.svg" /><figcaption><b>6 · resolve</b>rows settle on load (animated)</figcaption></figure>
  </body>
</html>
